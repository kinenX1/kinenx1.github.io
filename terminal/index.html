<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Roadster Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1b1d23; --win:#23262e; --bar:#2c3039; --text:#e6e1d6;
    --dim:#8a8f9c; --green:#9ccf8a; --yellow:#e8c879; --red:#e88a7d; --blue:#8fb8e8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(circle at 30% 20%,#2a2e38 0%,var(--bg) 60%);
    font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
    color:var(--text); display:flex; align-items:center; justify-content:center; padding:16px;
  }
  .win{
    width:100%; max-width:760px; height:min(560px,85vh);
    background:var(--win); border-radius:12px; overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.05);
    display:flex; flex-direction:column;
  }
  .bar{background:var(--bar); padding:11px 14px; display:flex; align-items:center; gap:8px; position:relative}
  .dot{width:12px;height:12px;border-radius:50%}
  .r{background:#ec6a5e}.y{background:#f4bf4f}.g{background:#61c554}
  .title{position:absolute;left:0;right:0;text-align:center;font-size:12px;color:var(--dim);pointer-events:none}
  .body{flex:1; overflow-y:auto; padding:18px 18px 24px; font-size:14px; line-height:1.65}
  .line{white-space:pre-wrap; word-break:break-word}
  .prompt{color:var(--green)} .path{color:var(--blue)}
  .dim{color:var(--dim)} .ok{color:var(--green)} .warn{color:var(--yellow)} .err{color:var(--red)}
  .big{font-weight:600; font-size:16px; color:var(--yellow)}
  .inputline{display:flex; gap:8px; align-items:baseline}
  #cmd{
    flex:1; background:transparent; border:none; outline:none; color:var(--text);
    font:inherit; caret-color:var(--yellow); min-width:0;
  }
  .hint{margin-top:6px}
  .chip{display:inline-block;margin-top:4px;padding:2px 8px;border:1px solid #3a3f4a;border-radius:6px;color:var(--yellow);cursor:pointer}
  .chip:hover{background:#2c3039}
</style>
</head>
<body>
<div class="win" onclick="document.getElementById('cmd').focus()">
  <div class="bar">
    <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
    <div class="title">kinen@roadster — terminal</div>
  </div>
  <div class="body" id="out">
    <div class="line dim">Roadster Terminal v1.0 — welcome 👋</div>
    <div class="line dim">Type a command and press Enter. Type <span class="warn">help</span> to see commands.</div>
    <div class="line hint">Try: <span class="chip" id="try">Check Roadster Artifacts</span></div>
    <div class="line">&nbsp;</div>
    <div class="inputline" id="inputline">
      <span><span class="prompt">kinen@roadster</span>:<span class="path">~</span>$</span>
      <input id="cmd" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus>
    </div>
  </div>
</div>

<script>
const out = document.getElementById('out');
const inputLine = document.getElementById('inputline');
const cmd = document.getElementById('cmd');
let busy = false;
const history = []; let hIndex = 0;

const sleep = ms => new Promise(r => setTimeout(r, ms));
function print(html, cls){
  const d = document.createElement('div');
  d.className = 'line' + (cls ? ' ' + cls : '');
  d.innerHTML = html;
  out.insertBefore(d, inputLine);
  out.scrollTop = out.scrollHeight;
  return d;
}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}

async function typeOut(text, cls, speed=22){
  const d = print('', cls);
  for (const ch of text){ d.textContent += ch; out.scrollTop = out.scrollHeight; await sleep(speed); }
}

async function checkRoadster(){
  const items = ['Slides','Animations','Photos','Music','Website link'];
  await typeOut('Connecting to Roadster servers...', 'dim');
  await sleep(300);
  for (const it of items){
    const d = print(`  [<span class="warn">....</span>] ${it}`);
    await sleep(450);
    d.innerHTML = `  [<span class="ok"> OK </span>] ${it}`;
  }
  await sleep(300);
  // progress bar
  const bar = print('');
  for (let i=0;i<=20;i++){
    bar.innerHTML = `  <span class="ok">${'█'.repeat(i)}</span><span class="dim">${'░'.repeat(20-i)}</span> ${i*5}%`;
    out.scrollTop = out.scrollHeight;
    await sleep(45);
  }
  print('&nbsp;');
  await typeOut('✓ I checked up — that\'s alllll in! 🚗⚡', 'big', 35);
  print('&nbsp;');
}

const commands = {
  'help': () => {
    print('Available commands:', 'dim');
    print('  <span class="warn">Check Roadster Artifacts</span>  — check everything is ready');
    print('  <span class="warn">clear</span>                     — clear the screen');
    print('  <span class="warn">whoami</span>                    — who are you?');
  },
  'clear': () => { [...out.querySelectorAll('.line')].forEach(l => l.remove()); },
  'whoami': () => print('a friend of Kinen 😎'),
  'check roadster artifacts': checkRoadster,
};

async function run(raw){
  const text = raw.trim();
  print(`<span class="prompt">kinen@roadster</span>:<span class="path">~</span>$ ${esc(raw)}`);
  if (!text) return;
  history.push(text); hIndex = history.length;
  const fn = commands[text.toLowerCase().replace(/\s+/g,' ')];
  busy = true; inputLine.style.visibility = 'hidden';
  if (fn) await fn();
  else print(`command not found: ${esc(text)} — type <span class="warn">help</span>`, 'err');
  busy = false; inputLine.style.visibility = 'visible';
  cmd.focus(); out.scrollTop = out.scrollHeight;
}

cmd.addEventListener('keydown', e => {
  if (busy) { e.preventDefault(); return; }
  if (e.key === 'Enter'){ const v = cmd.value; cmd.value=''; run(v); }
  else if (e.key === 'ArrowUp' && history.length){ hIndex=Math.max(0,hIndex-1); cmd.value=history[hIndex]; e.preventDefault(); }
  else if (e.key === 'ArrowDown' && history.length){ hIndex=Math.min(history.length,hIndex+1); cmd.value=history[hIndex]||''; e.preventDefault(); }
});
document.getElementById('try').addEventListener('click', e => {
  e.stopPropagation(); if (!busy) run('Check Roadster Artifacts');
});
</script>
</body>
</html>
