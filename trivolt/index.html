<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#071225">
<meta name="description" content="Live trivia battles with your friends: lobbies, teams, bets, voice and power-ups.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trivolt">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}input{user-select:text;-webkit-user-select:text}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Trivolt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@400;500;700&display=swap">
<style>
/* Layout: one-screen mobile app, electric night arcade: deep indigo, volt orange, cyan. Single committed dark look. */
:root{
  --sea:#071225; --sea2:#0d1e3a; --sea3:#183457;
  --bronze:#22d39b; --bronze2:#9dffd6;
  --red:#7b5cff; --sand:#eaf6ff; --mute:#8fb0c9;
  --good:#3fbf7f; --bad:#ef5b5b;
  --display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif; --body:"Rubik",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--sea);color:var(--sand);font-family:var(--body);font-size:15px;overflow:hidden}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--bronze2);outline-offset:2px}
.app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;position:relative;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen{flex:1;display:flex;flex-direction:column;min-height:0;padding-block:16px;gap:14px;overflow-y:auto}
.screen>*{flex-shrink:0}
.panel.big-card{flex-direction:row}.big-card>span:not(.art):not(.pill){flex:1;min-width:0}.mode>.pill{align-self:flex-start}.panel.big-card>.flame{flex:0 0 auto}.btn.primary .skis{color:#1d0f00}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.02em}
h2{font-size:22px;color:var(--bronze2)} h3{font-size:16px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--mute);font-weight:500}
.muted{color:var(--mute);font-size:13px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 16px;border-radius:12px;font-weight:700;width:100%;transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(180deg,var(--bronze2),var(--bronze));color:#1d0f00}
.btn.red{background:var(--red);color:#fff}
.btn.ghost{background:var(--sea2);border:1px solid var(--sea3)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.panel{background:var(--sea2);border:1px solid var(--sea3);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 12px;border-radius:999px;background:var(--sea);border:1px solid var(--sea3);font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--bronze);color:#1d0f00;border-color:var(--bronze)}
.chip:disabled{opacity:.35}
input.field{width:100%;padding:12px 14px;border-radius:12px;background:var(--sea);border:1px solid var(--sea3)}
.skis{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--bronze2)}
.coin{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--bronze2),var(--bronze) 60%,#8a5a1c);box-shadow:inset 0 0 0 2px #8a5a1c55}
/* splash */
#splash{justify-content:center;align-items:center;text-align:center}
#splash .logo{width:150px;animation:rise 1s ease-out both}
#splash h1{font-size:34px;font-weight:800;color:var(--sand);animation:rise 1s .2s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}

/* top bar & tabs */
.topbar{display:flex;align-items:center;justify-content:space-between;padding-top:12px;gap:8px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:18px}
.brand svg{width:30px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--sea2);border:1px solid var(--sea3);border-radius:14px;padding:4px;margin-top:10px}
.tab{padding:9px 0;border-radius:10px;font-size:13px;font-weight:500;color:var(--mute)}
.tab[aria-selected="true"]{background:var(--sea3);color:var(--sand)}
.big-card{display:flex;align-items:center;gap:14px;text-align:left;padding:18px}
.big-card .ic{font-family:var(--display);width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-size:24px;font-weight:800;flex:none}
.avatar{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff;background-size:cover;background-position:center;border:2px solid var(--sea3)}
.avatar.lg{width:72px;height:72px;font-size:28px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--sea)}
.item .grow{flex:1;min-width:0}
.pill{font-size:11px;padding:3px 8px;border-radius:999px;background:var(--sea3);color:var(--sand);font-weight:500;white-space:nowrap}
.pill.red{background:var(--red);color:#fff}.pill.gold{background:var(--bronze);color:#1d0f00}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:36px;height:36px;border-radius:10px;background:var(--sea);border:1px solid var(--sea3);font-size:20px}
.stepper output{font-size:22px;font-weight:700;min-width:48px;text-align:center;font-variant-numeric:tabular-nums}
/* lobby */
.code{font-family:var(--display);font-size:40px;letter-spacing:.25em;color:var(--bronze2);text-align:center;font-weight:800}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.team{background:var(--sea);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;border-top:3px solid var(--tc)}
.tp{display:flex;align-items:center;gap:6px;font-size:13px;min-width:0}
.tp span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tp .avatar{width:24px;height:24px;font-size:11px;border-width:1px}
.chat{height:150px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;font-size:13px;padding:8px;background:var(--sea);border-radius:12px}
.chat b{color:var(--bronze2);font-weight:500}
.chat .sys{color:var(--mute);font-style:italic}
.vc{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vc button{padding:10px;border-radius:12px;background:var(--sea);border:1px solid var(--sea3);font-size:13px;text-align:left}
.vc button[aria-pressed="true"]{border-color:var(--good);box-shadow:inset 0 0 0 1px var(--good)}
/* themes */
:root[data-th="sunset"]{--sea:#1b0a2c;--sea2:#2b1145;--sea3:#4a1f6b;--bronze:#ff4f81;--bronze2:#ffb347;--red:#8a2be2;--sand:#fff0f6;--mute:#c19ad6}
:root[data-th="matrix"]{--sea:#020a05;--sea2:#07160d;--sea3:#0f2a19;--bronze:#00e06c;--bronze2:#b6ffcf;--red:#00994a;--sand:#e5ffe9;--mute:#7fae8c}
:root[data-th="night"]{--sea:#13112a;--sea2:#1d1a3d;--sea3:#2c2858;--bronze:#ff7a2f;--bronze2:#ffb347;--red:#6c4dff;--sand:#f1efff;--mute:#9a96c4}
:root[data-th="ocean"]{--sea:#04192b;--sea2:#0a2a42;--sea3:#12405e;--bronze:#00c2c7;--bronze2:#7cf5e8;--red:#1f6fff;--sand:#e6fbff;--mute:#86b4c9}
:root[data-th="jungle"]{--sea:#0b1a10;--sea2:#12291a;--sea3:#1e4028;--bronze:#9be22d;--bronze2:#e8ff6b;--red:#1fa060;--sand:#f0ffe8;--mute:#93b89a}
:root[data-th="lava"]{--sea:#1a0806;--sea2:#2c0f0a;--sea3:#4a1a10;--bronze:#ff4500;--bronze2:#ffae00;--red:#c2185b;--sand:#fff1e8;--mute:#c99a8a}
:root[data-th="galaxy"]{--sea:#05060f;--sea2:#10132a;--sea3:#1f2550;--bronze:#a78bfa;--bronze2:#f0abfc;--red:#4f46e5;--sand:#eef0ff;--mute:#9aa0c8}
/* game */
.timer{height:8px;border-radius:99px;background:var(--sea3);overflow:hidden}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--bronze2));width:100%;transition:width .25s linear}
.count{font-family:var(--display);font-size:56px;text-align:center;color:var(--bronze2);font-weight:800;font-variant-numeric:tabular-nums}
.q{font-size:20px;font-weight:500;line-height:1.35;text-wrap:balance}
.opts{display:grid;gap:10px}
.opt{padding:14px;border-radius:12px;background:var(--sea2);border:1px solid var(--sea3);text-align:left;font-weight:500;display:flex;flex-direction:column;gap:6px}
.opt.pick{border-color:var(--bronze2)}
.opt.right{border-color:var(--good);background:#173a2e}
.opt.wrong{border-color:var(--bad);background:#3a1c22}
.who{display:flex;flex-wrap:wrap;gap:4px;font-size:11px;color:var(--mute);font-weight:400}
.who .avatar{width:20px;height:20px;font-size:9px;border-width:1px}
.vote{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vote.three{grid-template-columns:repeat(3,1fr)}
.vote button{padding:14px 8px;border-radius:12px;background:var(--sea);border:1px solid var(--sea3);display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700}
.vote button small{font-weight:400;color:var(--mute);font-variant-numeric:tabular-nums}
.vote button[aria-pressed="true"]{border-color:var(--bronze2);background:#2e2350}
.board .item{font-variant-numeric:tabular-nums}
.sheet-wrap{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{width:100%;max-width:480px;background:var(--sea2);border-radius:20px 20px 0 0;border:1px solid var(--sea3);
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:12px;max-height:85%;overflow-y:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--sand);color:var(--sea);padding:10px 16px;border-radius:12px;font-weight:500;z-index:30;max-width:90%;text-align:center}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{background:var(--sea);border:1px solid var(--sea3);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;text-align:left}
.mode .glyph{font-family:var(--display);font-size:22px;color:var(--bronze2);font-weight:800}
.mode[aria-pressed="true"]{border-color:var(--bronze2);background:#2e2350}
.err{color:var(--bad);font-size:13px;min-height:1em}
.idcard{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;background:linear-gradient(135deg,#2e2350,var(--sea2));border:1px solid var(--bronze)}

#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.app{z-index:1}
.panel,.tabs,.item,.chat,.team,.vote button,.vc button,.opt,.chip,input.field{backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.panel,.tabs,.opt,.sheet{background:color-mix(in srgb,var(--sea2) 70%,transparent);box-shadow:0 10px 30px #0006,inset 0 1px 0 #ffffff14}
.item,.chat,.team,.vote button,.vc button,input.field,.chip{background:color-mix(in srgb,var(--sea) 62%,transparent)}
.ico{width:1.25em;height:1.25em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;transition:color .2s,background .2s}
.tab .ico{width:22px;height:22px}
.tab[aria-selected="true"]{color:#fff}
.art{position:relative;overflow:hidden;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2));isolation:isolate}
.art::before,.art::after{content:"";position:absolute;border-radius:50%;background:#ffffff26;z-index:-1}
.art::before{width:70%;aspect-ratio:1;right:-18%;top:-30%}
.art::after{width:40%;aspect-ratio:1;left:-10%;bottom:-25%;background:#0000002e}
.art .ico{filter:drop-shadow(0 4px 8px #0006);animation:bob 3.2s ease-in-out infinite}
.mode .art{height:86px}.mode .art .ico{width:44px;height:44px;stroke-width:1.8}
.big-card .art{width:54px;height:54px;flex:none}.big-card .art .ico{width:28px;height:28px}
.big-card{transition:transform .2s,box-shadow .2s}.big-card:hover{transform:translateY(-2px);box-shadow:0 14px 34px #6c4dff44}
.btn.primary,.btn.red{position:relative;overflow:hidden;box-shadow:0 6px 22px color-mix(in srgb,var(--bronze) 45%,transparent)}
.btn.red{background:linear-gradient(135deg,var(--red),#b14dff);box-shadow:0 6px 22px #6c4dff66}
.btn.primary::after,.btn.red::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,#ffffff55 50%,transparent 70%);transform:translateX(-100%);animation:shine 3s ease-in-out infinite}
.coin{animation:spin 3.5s linear infinite}
.logo svg,.brand svg{filter:drop-shadow(0 0 18px #6c4dffaa)}
#splash .logo svg{animation:float 3s ease-in-out infinite}
.count{animation:pop .5s cubic-bezier(.2,1.6,.4,1);text-shadow:0 0 24px #ff7a2f88}
.code{text-shadow:0 0 22px #ff7a2f66}
.timer i{box-shadow:0 0 12px var(--bronze)}.timer i.low{background:linear-gradient(90deg,#ef3b5b,#ff7a2f);animation:blink .5s infinite alternate}
.opt{transition:transform .15s,border-color .2s}.opt:not(:disabled):hover{transform:translateX(4px);border-color:var(--bronze)}
.opt.right{animation:glow .9s ease-in-out infinite alternate}.opt.wrong{animation:shake .45s}
.tp.new{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.screen.enter>*{animation:up .5s cubic-bezier(.2,.9,.3,1) both}
.screen.enter>*:nth-child(2){animation-delay:.06s}.screen.enter>*:nth-child(3){animation-delay:.12s}.screen.enter>*:nth-child(4){animation-delay:.18s}.screen.enter>*:nth-child(5){animation-delay:.24s}.screen.enter>*:nth-child(n+6){animation-delay:.3s}
.screen.enter .opt{animation:slide .45s cubic-bezier(.2,.9,.3,1) both}
.screen.enter .opt:nth-child(2){animation-delay:.08s}.screen.enter .opt:nth-child(3){animation-delay:.16s}.screen.enter .opt:nth-child(4){animation-delay:.24s}
.screen.enter .mode{animation:up .5s both}.screen.enter .mode:nth-child(even){animation-delay:.08s}
.sheet{animation:sheet .35s cubic-bezier(.2,.9,.3,1)}
.toast{animation:up .3s}
@keyframes up{from{opacity:0;transform:translateY(18px)}}
@keyframes slide{from{opacity:0;transform:translateX(-24px)}}
@keyframes sheet{from{transform:translateY(100%)}}
@keyframes pop{from{transform:scale(.4);opacity:0}}
@keyframes float{50%{transform:translateY(-10px) rotate(-3deg)}}
@keyframes bob{50%{transform:translateY(-5px) scale(1.06)}}
@keyframes shine{0%,60%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
@keyframes spin{to{transform:rotateY(360deg)}}
@keyframes blink{to{opacity:.55}}
@keyframes glow{from{box-shadow:0 0 0 #3fbf7f00}to{box-shadow:0 0 26px #3fbf7faa}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

.btn,.chip,.opt,.tab,.pill,.big-card,.pw,.vote button,.vc button{position:relative;overflow:hidden}
.ripple{position:absolute;border-radius:50%;background:#ffffff55;transform:scale(0);animation:rip .6s ease-out;pointer-events:none}
.app.shake{animation:shake .45s}
.overlay{position:fixed;inset:0;z-index:40;display:grid;place-items:center;pointer-events:none;background:radial-gradient(circle,color-mix(in srgb,var(--sea) 87%,transparent) 0,color-mix(in srgb,var(--sea) 45%,transparent) 70%)}
.ov-num{font-family:var(--display);font-size:150px;color:var(--bronze2);text-shadow:0 0 40px #ff7a2f;animation:zoom .72s ease-out both}
.ov-num.go{color:#35d0ff;text-shadow:0 0 50px #35d0ff}
.ov-card{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;animation:pop .5s cubic-bezier(.2,1.6,.4,1);padding:16px}
.ov-big{font-family:var(--display);font-size:46px;color:#fff;text-shadow:0 0 30px #6c4dff;animation:flip .6s both}
.ov-big.alt{color:var(--bronze2);text-shadow:0 0 30px #ff7a2f;animation-delay:.35s}
.floatpts{position:fixed;left:50%;top:38%;font-family:var(--display);font-size:56px;color:var(--good);text-shadow:0 0 24px #3fbf7f;z-index:35;pointer-events:none;animation:rise2 1.4s ease-out forwards}
.streakb{position:fixed;left:50%;top:24%;z-index:36;display:flex;gap:8px;align-items:center;padding:10px 18px;border-radius:999px;font-family:var(--display);font-size:22px;color:#fff;background:linear-gradient(135deg,#ff7a2f,#ef3b5b);box-shadow:0 0 30px #ff7a2f99;pointer-events:none;animation:banner 1.8s both}
.emote{position:fixed;bottom:14%;font-size:40px;z-index:35;pointer-events:none;animation:flyup 2s ease-out forwards}
.emobar{display:flex;gap:6px}.emobar button{flex:1;font-size:22px;padding:6px 0;border-radius:10px;background:color-mix(in srgb,var(--sea) 62%,transparent);transition:transform .15s}.emobar button:active{transform:scale(1.35)}
.powers{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:8px}
.pw{display:flex;align-items:center;justify-content:center;gap:6px;padding:9px;border-radius:12px;background:linear-gradient(135deg,#6c4dff55,#35d0ff33);border:1px solid #35d0ff55;font-weight:700;font-size:13px}
.pw:disabled{opacity:.3;filter:grayscale(1)}.pw.on{opacity:1;filter:none;animation:glow2 .8s infinite alternate}
.opt.gone{opacity:.15;transform:scale(.95);text-decoration:line-through}
.timer i.frozen{background:linear-gradient(90deg,#35d0ff,#bdf3ff);box-shadow:0 0 14px #35d0ff;animation:none}
.xpbar{height:10px;border-radius:99px;background:var(--sea3);overflow:hidden}
.xpbar i{display:block;height:100%;width:var(--w);background:linear-gradient(90deg,#6c4dff,#35d0ff,#ff7a2f,#6c4dff);background-size:300% 100%;animation:fill 1.2s cubic-bezier(.2,.9,.3,1) both,flow 4s linear infinite}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;background:linear-gradient(135deg,var(--bronze2),#ff5e9a);color:#1d0f00;font-weight:700;font-size:12px}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:end}
.pod{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.pn{font-size:12px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{width:100%;height:var(--h);border-radius:12px 12px 4px 4px;display:flex;flex-direction:column;align-items:center;padding-top:6px;color:#1d0f00;transform-origin:bottom;animation:grow .9s cubic-bezier(.2,.9,.3,1) both;font-variant-numeric:tabular-nums}
.bar b{font-family:var(--display);font-size:28px;line-height:1}.bar small{font-size:11px;font-weight:700}
.r1{background:linear-gradient(180deg,#ffd66b,#ff9d2f);box-shadow:0 0 26px #ffb34788}.r2{background:linear-gradient(180deg,#e8ecff,#9aa3c9)}.r3{background:linear-gradient(180deg,#f0a777,#b5652f)}
.ach-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ach{display:flex;gap:8px;align-items:center;padding:10px;border-radius:12px;font-size:12px;background:linear-gradient(135deg,#6c4dff44,#ff7a2f33)}
.ach .ico{width:26px;height:26px;color:var(--bronze2)}.ach.off{opacity:.4;filter:grayscale(1);background:color-mix(in srgb,var(--sea) 62%,transparent)}
.achtoast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;z-index:45;display:flex;gap:10px;align-items:center;padding:10px 16px;border-radius:14px;background:linear-gradient(135deg,#6c4dff,#ff7a2f);color:#fff;box-shadow:0 10px 30px #0008;animation:drop 3s both;max-width:90%}
.vote button .vb{position:absolute;left:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--bronze),var(--bronze2))}
@keyframes rip{to{transform:scale(4);opacity:0}}
@keyframes zoom{0%{transform:scale(2.4);opacity:0}30%{transform:scale(1);opacity:1}100%{transform:scale(.6);opacity:0}}

let AC;function tone(f,d,t=0,type="sine",v=.07,f2){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+t;o.type=type;o.frequency.setValueAtTime(f,s);if(f2)o.frequency.exponentialRampToValueAtTime(f2,s+d);g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g).connect(AC.destination);o.start(s);o.stop(s+d+.02)}catch(e){}}

function startGame(){clearTimers();if(G.speakT)clearInterval(G.speakT);G.speakT=setInterval(()=>{if(!G)return;G.spk=G.players.filter(p=>!!G.vc&&(p.me?G.mic&&Math.random()<.7:(G.vc==="gen"||p.host)&&Math.random()<.25)).map(p=>p.name);document.querySelectorAll("[data-spk]").forEach(el=>el.classList.toggle("speaking",G.spk.includes(el.dataset.spk)))},700);G.phase="vote";G.votes={vis:{anon:0,vis:0},diff:{e:0,m:0,h:0}};G.myVote={};

 let left=8;drawVote(left);every(()=>{left--;for(let i=0;i<per&&G.botVotes>0;i++){G.botVotes--;G.votes.vis[pick(["anon","vis"])]++;G.votes.diff[pick(["e","m","m","h"])]++}if(left<=0){finishVote();return}if(left<=3)snd("tick");drawVote(left)},1000)}
function drawVote(left){const v=G.votes,mv=G.myVote,tv=Math.max(1,v.vis.anon+v.vis.vis),td=Math.max(1,v.diff.e+v.diff.m+v.diff.h);

 <div class="panel"><span class="label">Difficulty</span><div class="vote three">${[["e","Easy"],["m","Medium"],["h","Hard"]].map(([k,l])=>`<button aria-pressed="${mv.diff===k}" data-a="vote" data-k="diff" data-v="${k}">${l}<small>${v.diff[k]} votes</small><i class="vb" style="width:${v.diff[k]/td*100}%"></i></button>`).join("")}</div></div></section>`}
function buildQs(d){
 let all=[];G.cfg.modes.forEach(m=>Q[m].forEach(q=>all.push({q,mode:m})));const gm=G.cfg.game||"mix";G.qt=gm==="blitz"?5:G.cfg.time;
 const want={mix:()=>1,blitz:x=>x.q.length!==3,type:x=>x.q.length===3,tf:x=>x.q.length===4}[gm];let pool=all.filter(want);

   cfg=ranked?{game:"mix",ranked:1,max:8,time:12,team:"Solos",modes:shuffle(S.owned).slice(0,4),rule:"wta",minBet:0,qs:7}:{game:pick(Object.keys(GAMES)),max:rnd(6,12),time:pick([10,15]),team:pick(["Solos","Duos","Trios"]),modes:shuffle(S.owned).slice(0,3),rule:pick(["wta","lf"]),minBet:5,qs:pick([5,7])};openLobby(false,String(rnd(10000,99999)))},800)},2700);mm._iv=iv;break}

 case"ans":{const q=G.qs[G.qi],me=G.players.find(p=>p.me);if(G.answers[me.name]||G.phase!=="q")return;buzz(15);const o=q.opts[+d.i];G.answers[me.name]={o,ok:o===q.ans,t:G.left};snd("power");drawQ();if(allIn())reveal();break}
 case"again":createLobby();cfg=G.cfg;drawCreate();break;
 case"install":sheet(`<h3>Get Trivolt</h3><p class="muted">Download the Android app, or add Trivolt to your home screen.</p>

 case"pwaold":if(window.__dp){window.__dp.prompt();window.__dp.userChoice.finally(()=>window.__dp=null);break}if(matchMedia("(display-mode: standalone)").matches){toast("Trivolt is already installed");break}sheet(`<h3>Download Trivolt</h3><p class="muted">Install Trivolt on your phone so it opens like a normal app, full screen, with its own icon.</p>
  <div class="list"><div class="item"><b>Android</b><span class="grow">Chrome menu → Install app</span></div><div class="item"><b>iPhone</b><span class="grow">Share → Add to Home Screen</span></div></div>

 case"addfriend":sheet(`<h3>Add a friend</h3><input class="field" id="fid" placeholder="Their player ID" autocomplete="off"><p class="err" id="er"></p><button class="btn primary" data-a="dofriend">Send request</button>`);break;
 case"dofriend":{const v=$("#fid").value.trim();if(!/^[a-z0-9_.]{3,14}$/i.test(v)){$("#er").textContent="That isn't a valid ID.";return}S.friends.push({id:v,c:rnd(0,7)});save();closeSheet();toast(`${v} added`);home();break}
 case"gift":{const f=S.friends[+d.i],today=new Date().toDateString();if(S.giftDay!==today){S.giftDay=today;S.giftedToday=0}
  const left=Math.min(GIFT_CAP-S.giftedToday,S.skis);
  sheet(`<h3>Gift Skis to ${esc(f.id)}</h3><p class="muted">You can still gift ${GIFT_CAP-S.giftedToday} Skis today.</p><input class="field" id="ga" type="number" min="1" max="${left}" value="${Math.min(5,left)}" inputmode="numeric"><p class="err" id="er"></p><button class="btn primary" data-a="dogift" data-i="${d.i}" ${left<1?"disabled":""}>Send gift</button>`);break}
 case"dogift":{const f=S.friends[+d.i],n=Math.floor(+$("#ga").value);if(!(n>=1)||n>S.skis||S.giftedToday+n>GIFT_CAP){$("#er").textContent=`Pick 1–${Math.min(GIFT_CAP-S.giftedToday,S.skis)} Skis.`;return}
  S.skis-=n;S.giftedToday+=n;addHistory(`Gift to ${f.id}`,-n);unlock("social");closeSheet();toast(`Sent ${n} Skis to ${f.id}`);home();break}
 case"trade":{const f=S.friends[+d.i],own=MODES.filter(m=>S.owned.includes(m.id));
  sheet(`<h3>Trade with ${esc(f.id)}</h3><label class="label" for="tg">You give</label><input class="field" id="tg" type="number" min="1" value="10" inputmode="numeric">
  <label class="label" for="tw">You want</label><select class="field" id="tw">${MODES.filter(m=>!S.owned.includes(m.id)).map(m=>`<option>${m.name}</option>`).join("")}<option>Skis back later</option></select>
  <p class="muted">Both players must confirm before anything moves.</p><button class="btn primary" data-a="dotrade" data-i="${d.i}">Send offer</button>`);break}
 case"dotrade":{const f=S.friends[+d.i];S.trades.unshift({text:`${$("#tg").value} Skis → ${f.id} for ${$("#tw").value}`,status:"Waiting"});S.trades=S.trades.slice(0,5);save();closeSheet();toast("Trade offer sent");home();break}
 case"manager":{const draw=()=>sheet(`<h3>Manager support</h3><div class="chat" id="mc">${S.manager.map(m=>`<div><b>${m.me?"You":"Manager"}</b> ${esc(m.t)}</div>`).join("")||`<div class="sys">Tell the Manager what's going on.</div>`}</div>
  <form class="row" id="mf"><input class="field" id="mm" placeholder="Write a message" autocomplete="off"><button class="pill gold" style="padding:12px">Send</button></form>`);
  draw();const bind=()=>{$("#mc").scrollTop=1e9;$("#mf").onsubmit=ev=>{ev.preventDefault();const v=$("#mm").value.trim();if(!v)return;S.manager.push({me:1,t:v});
   if(S.manager.filter(m=>!m.me).length<S.manager.filter(m=>m.me).length)S.manager.push({t:"Thanks, your message reached the Manager. Expect a reply within 24 hours."});save();draw();bind()}};bind();break}
 case"logout":sheet(`<h3>Log out?</h3><p class="muted">On this prototype, logging out clears the profile saved on this device.</p><button class="btn red" data-a="dologout">Log out</button><button class="btn ghost" data-a="close">Cancel</button>`);break;
 case"dologout":try{localStorage.removeItem("qq")}catch(e){}location.reload();break;
 }});

/* ---------- animated background + confetti ---------- */
const fx=document.getElementById("fx"),cx=fx.getContext("2d"),RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
let W,H,DP,parts=[],conf=[],syms=[];
function size(){DP=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;fx.width=W*DP;fx.height=H*DP;cx.setTransform(DP,0,0,DP,0,0);const st=TH.fx;
 const N=st==="stars"?Math.round(W*H/4000):st==="fireflies"?28:st==="bubbles"?40:st==="embers"?70:Math.round(W*H/9000);
 parts=Array.from({length:N},()=>({x:Math.random()*W,y:Math.random()*H,r:st==="bubbles"?Math.random()*6+2:Math.random()*1.8+.4,v:st==="embers"?Math.random()*1.2+.4:Math.random()*.35+.08,p:Math.random()*6,dx:Math.random()-.5,dy:Math.random()-.5}));
 syms=Array.from({length:8},()=>({x:Math.random()*W,y:Math.random()*H,t:"?⚡★!?"[rnd(0,4)],s:rnd(18,44),v:Math.random()*.25+.1,a:Math.random()*6}))}
function confetti(n,coin){const cols=["#ff7a2f","#ffb347","#35d0ff","#6c4dff","#3fbf7f","#ff5e9a"];
 for(let i=0;i<n;i++)conf.push({coin,x:coin?Math.random()*W:W/2+(Math.random()-.5)*W*.4,y:coin?-20-Math.random()*200:H*.35,vx:coin?(Math.random()-.5)*2:(Math.random()-.5)*12,vy:coin?Math.random()*3:-Math.random()*13-4,r:Math.random()*6.28,vr:(Math.random()-.5)*.4,w:rnd(6,11),c:cols[i%6],l:1})}
let shoot=null;
function grid(t){const y0=H*.62,sr=Math.min(W,H)*.2,sy=y0-sr*.35;
 const g=cx.createLinearGradient(0,sy-sr,0,sy+sr);g.addColorStop(0,"rgba(255,214,107,.75)");g.addColorStop(1,"rgba(255,79,129,.75)");
 cx.save();cx.beginPath();cx.rect(0,0,W,y0);cx.clip();cx.fillStyle=g;cx.beginPath();cx.arc(W/2,sy,sr,0,6.28);cx.fill();cx.fillStyle=TH.bg;
 for(let k=0;k<6;k++){const yy=sy+sr*(.1+k*.16),hh=2+k*1.6;cx.fillRect(W/2-sr,yy,sr*2,hh)}cx.restore();
 const gg=cx.createLinearGradient(0,y0,0,H);gg.addColorStop(0,"rgba(27,10,44,.2)");gg.addColorStop(1,"rgba(27,10,44,.85)");cx.fillStyle=gg;cx.fillRect(0,y0,W,H-y0);
 cx.strokeStyle="rgba(255,79,129,.45)";cx.lineWidth=1.2;cx.beginPath();
 for(let k=-14;k<=14;k++){cx.moveTo(W/2+k*8,y0);cx.lineTo(W/2+k*W*.14,H)}
 const off=(t*.00035)%1;for(let k=0;k<14;k++){const f=((k+off)/14),yy=y0+(H-y0)*f*f;cx.moveTo(0,yy);cx.lineTo(W,yy)}cx.stroke();
 cx.fillStyle="rgba(255,79,129,.6)";cx.fillRect(0,y0-1,W,2)}
function aurora(t){cx.save();cx.globalCompositeOperation="lighter";const cols=[[34,211,155],[123,92,255],[40,160,255]];
 cols.forEach((c,k)=>{const base=H*(.18+k*.1),amp=H*.06,len=W/24;cx.beginPath();
  for(let i=0;i<=24;i++){const x=i*len,y=base+Math.sin(i*.45+t*.0004*(k+1)+k)*amp+Math.sin(i*.17-t*.0003)*amp*.6;i?cx.lineTo(x,y):cx.moveTo(x,y)}
  for(let i=24;i>=0;i--){const x=i*len,y=base+Math.sin(i*.45+t*.0004*(k+1)+k)*amp+Math.sin(i*.17-t*.0003)*amp*.6+H*(.22+.06*Math.sin(t*.0005+i*.3));cx.lineTo(x,y)}
  cx.closePath();const g=cx.createLinearGradient(0,base-amp,0,base+H*.3);g.addColorStop(0,`rgba(${c},0)`);g.addColorStop(.25,`rgba(${c},.28)`);g.addColorStop(1,`rgba(${c},0)`);cx.fillStyle=g;cx.fill()});
 cx.restore();cx.fillStyle="rgba(4,10,24,.55)";cx.beginPath();cx.moveTo(0,H);for(let i=0;i<=12;i++){cx.lineTo(i*W/12,H*.86-Math.abs(Math.sin(i*1.7))*H*.08)}cx.lineTo(W,H);cx.fill()}
let mcols=[];function matrix(){const fs=16,n=Math.ceil(W/fs);if(mcols.length!==n)mcols=Array.from({length:n},()=>Math.random()*-60);cx.font=`${fs}px monospace`;cx.textAlign="center";
 mcols.forEach((y,i)=>{const yy=y*fs;for(let k=0;k<14;k++){const a=(1-k/14)*(k?0.35:0.9);cx.fillStyle=k?`rgba(0,224,108,${a})`:"rgba(200,255,220,.9)";cx.fillText("01アイウエオカキ?!"[(i*7+k+Math.floor(y))%17],i*fs+fs/2,yy-k*fs)}
  mcols[i]=y+.18+(i%3)*.06;if(yy-14*fs>H)mcols[i]=Math.random()*-30})}
function frame(t){cx.fillStyle=TH.bg;cx.fillRect(0,0,W,H);const st=TH.fx;
 TH.bl.forEach((c,i)=>{const sp=[.00011,.00013,.00009,.0001][i],bx=[.2,.85,.8,.1][i],by=[.15,.75,.1,.85][i],br=[.55,.5,.4,.45][i];
  const x=W*(bx+Math.sin(t*sp+i)*.12),y=H*(by+Math.cos(t*sp*1.3+i)*.1),r=Math.max(W,H)*br;
  const g=cx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(${c},.4)`);g.addColorStop(1,`rgba(${c},0)`);cx.fillStyle=g;cx.fillRect(0,0,W,H)});
 if(st==="grid")grid(t);if(st==="aurora")aurora(t);if(st==="matrix")matrix();
 cx.textAlign="center";syms.forEach(s=>{s.y-=s.v;s.a+=.01;if(s.y<-50){s.y=H+50;s.x=Math.random()*W}cx.save();cx.translate(s.x+Math.sin(s.a)*20,s.y);cx.rotate(Math.sin(s.a)*.3);
  cx.font=`${s.s}px "Lilita One",sans-serif`;cx.fillStyle="rgba(255,255,255,.05)";cx.fillText(s.t,0,0);cx.restore()});
 parts.forEach(p=>{p.p+=.03;
  if(st==="bubbles"){p.y-=p.v*1.6;if(p.y<-10){p.y=H+10;p.x=Math.random()*W}cx.globalAlpha=.35;cx.strokeStyle="#bff8ff";cx.lineWidth=1.2;cx.beginPath();cx.arc(p.x+Math.sin(p.p)*6,p.y,p.r,0,6.28);cx.stroke();cx.globalAlpha=.5;cx.fillStyle="#fff";cx.beginPath();cx.arc(p.x+Math.sin(p.p)*6-p.r*.35,p.y-p.r*.35,p.r*.25,0,6.28);cx.fill()}
  else if(st==="fireflies"){p.x+=p.dx*.6+Math.sin(p.p)*.3;p.y+=p.dy*.6+Math.cos(p.p*.8)*.3;if(p.x<0||p.x>W)p.dx*=-1;if(p.y<0||p.y>H)p.dy*=-1;const a=.5+Math.sin(p.p*2)*.5;
   cx.globalAlpha=a*.25;cx.fillStyle="#e8ff6b";cx.beginPath();cx.arc(p.x,p.y,9,0,6.28);cx.fill();cx.globalAlpha=a;cx.beginPath();cx.arc(p.x,p.y,2.2,0,6.28);cx.fill()}
  else if(st==="embers"){p.y-=p.v;p.x+=Math.sin(p.p)*.6;if(p.y<-5){p.y=H+5;p.x=Math.random()*W}const k=p.y/H;cx.globalAlpha=Math.max(0,k)*(.6+Math.sin(p.p*5)*.4);cx.fillStyle=k>.5?"#ffae00":"#ff4500";cx.beginPath();cx.arc(p.x,p.y,p.r*k+.4,0,6.28);cx.fill()}
  else if(st==="aurora"){p.y+=p.v*.8;p.x+=Math.sin(p.p)*.3;if(p.y>H+5){p.y=-5;p.x=Math.random()*W}cx.globalAlpha=.55;cx.fillStyle="#eaf6ff";cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.28);cx.fill()}
  else if(st==="matrix"){}
  else if(st==="stars"){cx.globalAlpha=.25+Math.abs(Math.sin(p.p*.7))*.75;cx.fillStyle="#fff";cx.beginPath();cx.arc(p.x,p.y,p.r*.8,0,6.28);cx.fill()}
  else{p.y-=p.v;if(p.y<-5){p.y=H+5;p.x=Math.random()*W}cx.globalAlpha=.35+Math.sin(p.p)*.3;cx.fillStyle="#fff";cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.28);cx.fill()}});
 if(st==="stars"){if(!shoot&&Math.random()<.008)shoot={x:Math.random()*W,y:Math.random()*H*.5,l:1};if(shoot){shoot.x+=9;shoot.y+=4;shoot.l-=.025;const g=cx.createLinearGradient(shoot.x-90,shoot.y-40,shoot.x,shoot.y);g.addColorStop(0,"rgba(255,255,255,0)");g.addColorStop(1,`rgba(255,255,255,${shoot.l})`);cx.globalAlpha=1;cx.strokeStyle=g;cx.lineWidth=2;cx.beginPath();cx.moveTo(shoot.x-90,shoot.y-40);cx.lineTo(shoot.x,shoot.y);cx.stroke();if(shoot.l<=0)shoot=null}}
 cx.globalAlpha=1;conf=conf.filter(c=>c.y<H+20&&c.l>0);conf.forEach(c=>{c.vy+=.35;c.vx*=.99;c.x+=c.vx;c.y+=c.vy;c.r+=c.vr;c.l-=.004;
  cx.save();cx.translate(c.x,c.y);cx.rotate(c.r);if(c.coin){cx.fillStyle="#ffb347";cx.strokeStyle="#c46a12";cx.lineWidth=2;cx.beginPath();cx.ellipse(0,0,Math.abs(Math.cos(c.r*2))*8+1,9,0,0,6.28);cx.fill();cx.stroke()}else{cx.fillStyle=c.c;cx.fillRect(-c.w/2,-c.w/4,c.w,c.w/2)}cx.restore()});
 if(RM)return;if(S.lowfx)setTimeout(()=>requestAnimationFrame(frame),400);else requestAnimationFrame(frame)}
window.__fxReady=1;size();addEventListener("resize",size);requestAnimationFrame(frame);
splash();
